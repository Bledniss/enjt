import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

// La versión de la app es la del juego incluido: se lee de web/version.json
def gameVersion = new JsonSlurper().parse(file("$rootDir/web/version.json")).version as String
def v = gameVersion.tokenize('.').collect { it as int }

// Firma fija opcional (secretos de GitHub). Sin ella se usa la clave de depuración de cada compilación.
def keystorePath = System.getenv("KEYSTORE_FILE")
def keystorePass = System.getenv("KEYSTORE_PASSWORD")
// El alias se lee del propio almacén PKCS12 (los generados en Windows no usan un alias predecible).
// Si la contraseña o el archivo no son correctos, la compilación falla aquí en vez de firmar con otra clave.
def keystoreAlias = null
if (keystorePath) {
    def ks = java.security.KeyStore.getInstance("PKCS12")
    new File(keystorePath).withInputStream { ks.load(it, keystorePass.toCharArray()) }
    keystoreAlias = ks.aliases().toList().find { ks.isKeyEntry(it) }
    if (keystoreAlias == null) throw new GradleException("El almacén de firma no contiene ninguna clave privada")
    println "Firma fija: alias '${keystoreAlias}'"
}

android {
    namespace 'com.enjt.roguelike'
    compileSdk 34

    defaultConfig {
        applicationId 'com.enjt.roguelike'
        minSdk 26
        targetSdk 34
        versionCode v[0] * 1000000 + v[1] * 1000 + v[2]
        versionName gameVersion
        // Carpeta web (HTTPS) donde la app busca version.json y el HTML nuevo; vacío = sin actualizaciones
        buildConfigField "String", "UPDATE_URL", "\"${project.findProperty('updateUrl') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    // El juego (web/index.html) viaja dentro de la APK como recurso
    sourceSets {
        main {
            assets.srcDirs += ["$rootDir/web"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        fija {
            if (keystorePath) {
                storeFile file(keystorePath)
                storeType "pkcs12"
                storePassword keystorePass
                keyAlias keystoreAlias
                keyPassword keystorePass
            }
        }
    }

    buildTypes {
        debug {
            if (keystorePath) {
                signingConfig signingConfigs.fija
            }
        }
    }
}
