<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0a12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ENJT roguelike v0.3.34</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@500;700;900&family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* Paleta v0.1.47 tomada de artefactos.png: azules de cristal, rojos/naranjas de fuego, oro, hierro oscuro y violeta */
:root{--bg:#0d0a12;--card:#1e1a27;--line:rgba(253,200,2,.22);--cy:#03b7fc;--vi:#0247ea;--mg:#f42700;--gd:#fdc802;--gr:#04c8fd;--tx:#f1f6fa;--mut:#a79fb6;--ft:'Outfit','Montserrat','Inter',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 0,#2b2435,#0d0a12 60%);color:var(--tx);font-family:var(--fb);overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;position:fixed;inset:0;width:100%}
body{display:flex;justify-content:center;align-items:stretch}
#wrap{width:100%;height:100%;max-width:560px;display:flex;flex-direction:column;position:relative;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:var(--bg);box-shadow:0 0 80px rgba(253,152,1,.08)}
/* Barra superior de medidas fijas (v0.2.30): el alto es siempre el mismo y el ancho de cada casilla depende solo del ancho
   de la pantalla, nunca de su contenido. Un texto que no cabe se encoge (fitHud) y, si aun así no cabe, se corta.
   Así el campo de juego no cambia de tamaño a mitad de partida. */
#hud{flex:none;height:80px;padding:6px 8px 4px;background:linear-gradient(#2b2435,#1e1a27);border-bottom:1px solid var(--line);display:grid;grid-template-columns:64px minmax(0,1fr);grid-template-rows:30px 34px;gap:5px 7px;z-index:5;overflow:hidden;font-variant-numeric:tabular-nums}
/* A la izquierda, a toda la altura de la barra (las dos líneas): la imagen de perfil y, en partida, el botón de pausa */
#hudLeft{grid-row:1/3;min-width:0;display:grid}
.hud-row{min-width:0;height:30px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.05fr) minmax(0,1.1fr) minmax(0,1.2fr) minmax(0,1.05fr);gap:5px}
.hud-row.stats{height:34px;grid-template-columns:repeat(4,minmax(0,1fr))}
.pill{display:flex;align-items:center;gap:3px;height:100%;min-width:0;padding:0 5px 0 3px;border-radius:99px;background:#161220;box-shadow:inset 2px 2px 5px rgba(0,0,0,.6),inset -1px -1px 3px rgba(90,85,102,.25);font:700 14px var(--ft);overflow:hidden;white-space:nowrap}
.pill .ico{flex:none;width:16px;height:16px}
.pill span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.stats .stat{height:100%;min-width:0;display:flex;flex-direction:column;justify-content:center;text-align:center;background:#161220;border-radius:10px;padding:0 3px;box-shadow:inset 1px 1px 4px rgba(0,0,0,.55);overflow:hidden}
.stat small,.stat span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.stat small{font:700 8px/11px var(--fb);color:var(--mut);letter-spacing:1px}.stat span{font:800 13px/16px var(--ft)}
.hud-btn{display:block;height:100%;min-width:0;border:0;border-radius:10px;padding:0 4px;font:800 12px/30px var(--ft);text-align:center;color:#2a1200;background:linear-gradient(135deg,#fdd605,#fd9801);cursor:pointer;box-shadow:0 0 12px rgba(253,200,2,.35);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hud-btn#bombBtn{background:linear-gradient(135deg,#3b3545,#1e1a27);box-shadow:inset 0 0 0 1.5px var(--gd),0 0 10px rgba(253,200,2,.25);font-size:19px;line-height:28px}
.hud-btn{display:flex;align-items:center;justify-content:center;padding:0}.hud-btn .ico,.hud-btn svg{width:24px;height:24px;vertical-align:0} /* v0.3.29: Mochila y Tienda, con icono */
#shopBtn.open{background:linear-gradient(135deg,#5a5566,#3b3545);color:#9a94a6;box-shadow:none} /* con la tienda abierta, el botón se apaga */
/* Mazmorra de la condición: las cifras de Daño, Daño rojo y Tiros de la barra "fallan" (glitch) */
#hud.glitch #dmgText,#hud.glitch #redDmgText,#hud.glitch #level{display:inline-block;animation:hudGlitch 1.6s steps(1) infinite}
#hud.glitch #redDmgText{animation-delay:-.5s}#hud.glitch #level{animation-delay:-1.1s}
@keyframes hudGlitch{
  0%,100%{text-shadow:none;transform:none;opacity:1}
  8%{text-shadow:-2px 0 #f42700,2px 0 #03b7fc;transform:translateX(-2px) skewX(-14deg)}
  12%{text-shadow:2px 0 #f42700,-2px 0 #03b7fc;transform:translateX(2px) skewX(10deg);opacity:.7}
  16%{text-shadow:none;transform:none;opacity:1}
  52%{text-shadow:-1px 0 #03b7fc,1px 0 #b98cff;transform:translateY(-1px) scaleY(1.25)}
  56%{text-shadow:3px 0 #f42700,-3px 0 #03b7fc;transform:translateX(-3px);opacity:.45}
  60%{text-shadow:none;transform:none;opacity:1}
  82%{text-shadow:1px 0 #f42700,-1px 0 #03b7fc;transform:skewX(18deg);opacity:.8}
  85%{text-shadow:none;transform:none;opacity:1}
}
/* Línea de datos deslizante (v0.3.0). Flota sobre el campo, pegada a la barra superior: es solo visual y no le quita
   sitio al juego (las bolas pueden quedar un poco tapadas). Con el botón (i) se quita y queda solo la "i" */
#ticker{flex:none;height:0;position:relative;z-index:4}
#ticker.idle{display:none} /* solo en partida */
#tickerBar{position:absolute;left:0;right:0;top:0;height:30px;overflow:hidden;background:rgba(22,18,32,.8);border-bottom:1px solid var(--line);pointer-events:none}
#ticker.off #tickerBar{display:none}
#tickerBtn{position:absolute;left:6px;top:5px;z-index:1;width:20px;height:20px;padding:0;border-radius:50%;border:1.5px solid var(--cy);background:#161220;color:var(--cy);font:italic 800 13px/17px Georgia,"Times New Roman",serif;cursor:pointer}
#ticker.off #tickerBtn{border-color:var(--mut);color:var(--mut);opacity:.8}
#tickerTrack{position:absolute;left:0;top:0;display:flex;align-items:center;width:max-content;height:100%;will-change:transform}
#tickerTrack.run{animation:tickerMove linear infinite}
@keyframes tickerMove{from{transform:translateX(var(--from))}to{transform:translateX(-100%)}}
.fx{display:flex;align-items:center;gap:6px;width:112px;flex:none;white-space:nowrap}
.fx img{flex:none;width:22px;height:22px}
.fx b{display:block;font:800 9px/11px var(--ft);letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.fx i{display:block;font:800 12px/13px var(--ft);font-style:normal}
.fx.bless i,.fx.coin i{color:#03b7fc}.fx.curse i,.fx.blind i,.fx.crack i{color:#f42700}.fx.crystal i{color:#03b7fc}.fx.fire i{color:#fd9801}.fx.gold i{color:#fdc802}
#game{position:relative;flex:1;overflow:hidden;background:#0d0a12}
canvas{width:100%;height:100%;display:block;position:absolute;inset:0;touch-action:none;will-change:transform}
#hint{position:absolute;bottom:5px;left:0;right:0;text-align:center;color:#7d748c;font:600 11px var(--fb);pointer-events:none;z-index:2;letter-spacing:.3px}
.ico{width:1.15em;height:1.15em;vertical-align:-.22em;object-fit:contain;filter:drop-shadow(0 0 4px rgba(255,255,255,.18))}
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(9,6,12,.5);backdrop-filter:blur(10px) saturate(1.25);-webkit-backdrop-filter:blur(10px) saturate(1.25);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s ease,visibility 0s linear .25s;z-index:30}
.modal.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .25s ease}
.panel{width:340px;max-width:90%;max-height:88%;overflow-y:auto;padding:18px;border-radius:22px;text-align:center;background:linear-gradient(160deg,rgba(52,43,57,.82),rgba(30,26,39,.88));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 60px rgba(0,0,0,.6),0 0 44px rgba(2,136,249,.14);transform:translateY(18px) scale(.97);transition:transform .32s cubic-bezier(.2,.8,.2,1);scrollbar-width:thin;scrollbar-color:var(--gd) transparent}
.modal.show .panel{transform:none}.panel.wide{width:500px}
/* En las ventanas largas (Inventario, Altar...) el último botón, que es el de Volver, se queda pegado abajo mientras se desliza */
.panel>.btn:last-child{position:sticky;bottom:0;z-index:2;box-shadow:0 -10px 14px 2px #241f2c} /* v0.3.29: sin la sombra sólida de debajo, que asomaba como un rectángulo */
.panel>.btn.ghost:last-child{background:#2c2634}
h2{font:800 19px var(--ft);margin:0 0 10px;letter-spacing:.5px;background:linear-gradient(90deg,#fdd605,#fd9801);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h1.game-title{font:900 28px/1.05 var(--ft);text-transform:uppercase;letter-spacing:1.5px;margin:4px 0 18px;display:inline-block;background:linear-gradient(120deg,var(--mg),var(--gd) 45%,var(--cy));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 12px rgba(244,39,0,.55));animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
button{font-family:var(--ft);cursor:pointer;color:var(--tx)}
.btn{display:block;width:100%;margin-top:9px;padding:12px 14px;border:1px solid rgba(253,200,2,.12);border-radius:14px;font:700 14px var(--ft);letter-spacing:.4px;background:linear-gradient(145deg,#3b3545,#251c28);box-shadow:5px 5px 12px rgba(0,0,0,.5),-3px -3px 9px rgba(90,85,102,.16),inset 0 1px 0 rgba(255,255,255,.07);transition:transform .12s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.15);box-shadow:5px 5px 12px rgba(0,0,0,.5),0 0 18px rgba(253,200,2,.28)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,#0288f9,#0228d8);border-color:rgba(255,255,255,.25);box-shadow:0 6px 22px rgba(2,104,247,.45)}
.btn.danger{background:linear-gradient(135deg,#f42700,#880500)}.btn.good{background:linear-gradient(135deg,#03b7fc,#0168f7)}.btn.gold{background:linear-gradient(135deg,#fdd605,#fd9801);color:#2a1200}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--mut)}
.btn:disabled{opacity:.45;filter:grayscale(.7);cursor:not-allowed;box-shadow:none}
.btn.stop-glow{background:linear-gradient(135deg,#f42700,#880500);color:#fff;animation:stopGlow 1s ease-in-out infinite}
@keyframes stopGlow{0%,100%{box-shadow:0 0 8px rgba(244,39,0,.45)}50%{box-shadow:0 0 22px 4px rgba(244,39,0,.9)}}
.btn.small{display:inline-block;width:auto;margin:0;padding:7px 12px;font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font:600 13px var(--fb)}
input[type=range]{width:100%;accent-color:var(--cy);margin:8px 0}
.seg{display:flex;gap:8px;margin-top:6px}.seg .btn{margin:0}.seg .btn.on{background:linear-gradient(135deg,#0288f9,#0228d8);box-shadow:0 0 16px rgba(3,183,252,.4)}
.shop-item{text-align:left;padding:10px 12px;margin-bottom:9px;border-radius:14px;background:linear-gradient(145deg,#2b2435,#1e1a27);border:1px solid rgba(253,200,2,.08);box-shadow:5px 5px 12px rgba(0,0,0,.4),-3px -3px 8px rgba(90,85,102,.12)}
.shop-item h4{margin:0 0 3px;font:800 13px var(--ft);color:var(--gd)}.shop-item p{margin:0 0 4px;font-size:11px;color:var(--mut)}
.shop-item .btn{margin-top:6px;font-size:12px;padding:9px 10px}
#rankScope .btn{padding:8px 6px;font-size:12px} /* Semanal / Muro de Leyendas (v0.3.29) */
.shop-row{display:flex;gap:6px}.shop-row .x5{flex:none;width:54px} /* v0.3.29: botón ×5 junto a cada compra de la tienda */
/* Inventario (v0.3.29): tarjetas con icono, nombre y botones */
.inv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}.inv-grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.inv-card{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;padding:8px 4px 6px;border-radius:12px;background:#161220;box-shadow:inset 1px 1px 4px rgba(0,0,0,.55);text-align:center}
.inv-card.off{opacity:.45}
.inv-ico{height:32px;display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1}.inv-ico .ico{width:28px;height:28px;vertical-align:0}
.inv-empty{width:24px;height:24px;border-radius:50%;border:2px dashed #5a5566}
.inv-card b{font:700 10.5px/1.25 var(--ft);color:var(--tx);overflow-wrap:anywhere}
.inv-card small{font-size:10px;line-height:1.25;color:var(--mut)}.inv-card .inv-n{font:800 13px var(--ft);color:var(--gd)}
.inv-btns{margin-top:auto;padding-top:3px;width:100%;display:flex;flex-direction:column;gap:4px}
.inv-btns .btn{position:relative;margin:0;width:100%;padding:6px 2px;font-size:10px}
.inv-btns .is-off{opacity:.45;filter:grayscale(.7);box-shadow:none}
.inv-btns select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer} /* el desplegable va invisible encima del botón "Cambiar" */
.note{font-size:11px;color:var(--gd);margin:2px 0 10px;line-height:1.4}
.box{text-align:left;font-size:12px;line-height:1.7;background:#161220;border:1px solid var(--line);border-radius:12px;padding:10px;max-height:300px;overflow-y:auto}
.info-grid{display:grid;grid-template-columns:1fr 1.7fr;gap:6px 10px;text-align:left;font-size:11px;background:#161220;border:1px solid var(--line);border-radius:12px;padding:10px;max-height:300px;overflow-y:auto}
.info-grid b{color:var(--gd)}.lore{font-size:11px;color:var(--mut);line-height:1.5;margin:10px 0 0;text-align:left}
.version-tag{display:inline-block;margin-top:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);font:700 11px var(--ft);color:var(--gd);cursor:pointer}
.version-tag:active{transform:scale(.95)}
/* Ventana de novedades (v0.1.50) */
.news-ver{margin:8px 0 2px;font:800 13px var(--ft);color:var(--gd)}.news-ver:first-child{margin-top:0}
.news-ver .news-date{font:600 11px var(--fb);color:var(--mut);margin-left:8px}
.news-ver small{font:600 10px var(--fb);color:var(--cy);margin-left:6px;letter-spacing:.5px}
#newsList ul{margin:0;padding-left:18px}#newsList li{margin:2px 0;line-height:1.45}
.floating-text{position:absolute;font:900 16px var(--ft);pointer-events:none;animation:floatUp .9s ease-out forwards;z-index:45;text-shadow:0 2px 8px #000;transform:translate(-50%,-50%);will-change:transform,opacity;white-space:nowrap}
@keyframes floatUp{0%{transform:translate(-50%,-50%) scale(.8);opacity:1}100%{transform:translate(-50%,-50%) translateY(-50px) scale(1.25);opacity:0}}
.ach{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.ach>div:nth-child(2){flex:1;font-size:11px}.ach .btn{width:auto;margin:0;padding:7px 9px;font-size:10px;flex:none}
.medal{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font:900 20px var(--ft);background:radial-gradient(circle at 35% 30%,#5a5566,#251c28);border:3px solid #3b3545;color:#7d748c}
.medal.on{background:radial-gradient(circle at 35% 30%,#fdd605,#fd9801 55%,#772602);border-color:#fdd605;color:#571701;animation:shine 2.2s ease-in-out infinite}
@keyframes shine{0%,100%{box-shadow:0 0 6px rgba(253,200,2,.4)}50%{box-shadow:0 0 20px rgba(253,200,2,.95)}}
.medal-pop{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:10px;align-items:center;padding:8px 16px 8px 10px;border-radius:99px;background:linear-gradient(135deg,rgba(87,23,1,.92),rgba(30,26,39,.92));border:1px solid var(--gd);box-shadow:0 0 30px rgba(253,200,2,.6);animation:pop 3s ease forwards;pointer-events:none;font:700 13px var(--ft);white-space:nowrap}
.mis-ico{flex:none;width:26px;font-size:20px;line-height:26px;text-align:center}
.medal-pop small{display:block;font-size:9px;color:var(--gd);letter-spacing:1.5px}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.06)}20%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.charcard{display:flex;gap:12px;align-items:center;text-align:left;padding:10px;margin-bottom:9px;border-radius:14px;cursor:pointer;background:linear-gradient(145deg,#2b2435,#1e1a27);border:2px solid transparent}
.charcard.sel{border-color:var(--gd);box-shadow:0 0 18px rgba(253,200,2,.35)}
.charcard .dot{width:36px;height:36px;border-radius:50%;flex:none;border:3px solid #fff;box-shadow:0 0 14px currentColor}.charcard b{font:800 14px var(--ft)}.charcard small{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.charcard>div:nth-child(2){flex:1}.charcard.locked .dot{filter:grayscale(.85) brightness(.6)}
.charcard .btn{width:auto;margin:0;padding:7px 9px;font-size:10px;line-height:1.5;flex:none;text-align:center}
/* Tragamonedas */
.reels{display:flex;gap:8px;justify-content:center;margin:10px 0 8px;padding:10px;border-radius:16px;background:linear-gradient(#3b3545,#1e1a27);border:2px solid var(--gd);box-shadow:inset 0 0 18px rgba(0,0,0,.7),0 0 22px rgba(253,200,2,.22)}
.reel{flex:1;max-width:86px;height:84px;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#342b39,#0d0a12);border:1px solid rgba(253,200,2,.35);box-shadow:inset 0 6px 10px rgba(0,0,0,.6),inset 0 -6px 10px rgba(0,0,0,.6)}
.reel .sym{display:none}.reel .sym.on{display:grid;place-items:center}
.reel img{width:54px;height:54px;object-fit:contain;display:block}
.reel.spin .sym.on{animation:reelRoll .12s linear infinite;filter:blur(1.5px)}
@keyframes reelRoll{0%{transform:translateY(-70%)}100%{transform:translateY(70%)}}
.reel.win{border-color:var(--gd);animation:shine 1s ease-in-out 3}
.symDust{font-size:46px;line-height:1;filter:drop-shadow(0 0 7px rgba(253,200,2,.75))}.prize .ps .symDust{font-size:20px}
.sym7{font:900 56px/1 var(--ft);background:linear-gradient(#fdd605,#fd9801 45%,#f42700);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 6px rgba(244,39,0,.7))}
.symLvl{font:900 32px/1 var(--ft);color:var(--cy);text-shadow:0 0 10px rgba(3,183,252,.8);text-align:center}.symLvl small{display:block;font:800 10px var(--ft);letter-spacing:1px;color:var(--gd);text-shadow:none}
.rou-wrap{position:relative;width:min(270px,76vw);margin:12px auto 8px}
#rouCanvas{position:static;width:100%;height:auto;touch-action:auto;will-change:auto}
.rou-pin{position:absolute;top:-9px;left:50%;margin-left:-11px;border:11px solid transparent;border-top:20px solid var(--gd);border-bottom:0;filter:drop-shadow(0 2px 2px rgba(0,0,0,.7))}
#rouResult{min-height:18px;margin:0 0 6px;font:800 13px var(--ft);color:var(--tx)}
#slotResult{min-height:18px;margin:0 0 4px;font:800 13px var(--ft);color:var(--tx)}
.prize{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:11px;line-height:1.4}
.prize .ps{width:28px;height:28px;flex:none;display:grid;place-items:center}.prize .ps img{width:26px;height:26px;object-fit:contain}.prize .ps .sym7{font-size:24px}.prize .ps .symLvl{font-size:18px}.prize .ps .symLvl small{display:none}
.prize>div:nth-child(2){flex:1}.prize i{font-style:normal;color:var(--mut)}.prize>div:last-child{color:var(--gd);font-weight:700}
#rankTabs .btn{padding:11px 2px;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mkt-sel{width:158px;margin:0;padding:7px 8px}
/* Maestro Bolero (v0.2.0): asistente en la esquina inferior con globo de texto; toda la pantalla avanza el diálogo */
#bolero{position:absolute;inset:0;z-index:45;display:none;cursor:pointer;background:linear-gradient(transparent 30%,rgba(9,6,12,.8))}
#bolero.show{display:block;animation:boleroIn .35s ease-out}
@keyframes boleroIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
#boleroImg{position:absolute;left:4px;bottom:6px;width:122px;height:auto;transform-origin:50% 100%;animation:wob 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
#boleroBubble{position:absolute;left:108px;right:10px;bottom:92px;min-height:86px;padding:9px 12px 22px;border-radius:16px 16px 16px 4px;background:#f9fcfd;color:#1e1a27;text-align:left;font:600 13px/1.45 var(--fb);box-shadow:0 8px 24px rgba(0,0,0,.55)}
#boleroBubble b{display:block;margin-bottom:3px;font:800 11px var(--ft);letter-spacing:.5px;color:#0247ea}
#boleroNext{position:absolute;right:11px;bottom:6px;font:700 10px var(--ft);font-style:normal;color:#5a5566;opacity:0;transition:opacity .2s}
#bolero.ready #boleroNext{opacity:1}
/* Logros en bloques plegables y resumen de récords del game over (v0.2.0) */
.ach-block{margin-bottom:8px;border:1px solid rgba(253,200,2,.14);border-radius:12px;overflow:hidden}
.ach-block:last-of-type{margin-bottom:0}
.ach-head{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border:0;background:linear-gradient(145deg,#2b2435,#1e1a27);font:800 12px var(--ft);color:var(--gd);text-align:left;cursor:pointer}
.ach-head .ach-title{flex:1;line-height:1.3}.ach-head .ach-prog{flex:none;color:var(--mut);font-size:11px}
.ach-block.done .ach-prog{color:var(--cy)}
.ach-chev{flex:none;display:inline-block;transition:transform .2s}.ach-block.collapsed .ach-chev{transform:rotate(-90deg)}
.ach-body{padding:0 10px}.ach-block.collapsed .ach-body{display:none}.ach-body .ach:last-child{border-bottom:0}
.ov{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:7px;padding:8px 12px;border-radius:12px;background:#161220;border:1px solid rgba(255,255,255,.06);text-align:left;font:600 12px var(--fb)}
.ov b{flex:none;font:800 16px var(--ft)}
.ov i{display:block;margin-top:1px;font:800 9px var(--ft);font-style:normal;letter-spacing:.8px;color:var(--gd)}
.ov.rec{border-color:var(--gd);box-shadow:0 0 14px rgba(253,200,2,.3)}.ov.rec b{color:var(--gd)}
/* Botón de pausa (v0.2.0): en la barra superior, a la izquierda de las monedas; siempre visible */
#pauseBtn{width:100%;height:100%;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:9px;padding:0;cursor:pointer;background:linear-gradient(145deg,#3b3545,#251c28);border:1px solid var(--line);box-shadow:2px 2px 6px rgba(0,0,0,.5)}
#pauseBtn i{display:block;width:8px;height:26px;border-radius:3px;background:var(--gd)}
#pauseBtn:active{transform:scale(.92)}
/* Fuera de la partida, el hueco del botón de pausa lo ocupa la imagen de perfil, que abre el Perfil (v0.2.30) */
#hudAvatar{width:100%;height:100%;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center}
#hudAvatar .av{--s:64px;border-color:var(--gd)}
#hudAvatar:active{transform:scale(.92)}
/* Menú único (v0.2.30): Iniciar partida a todo el ancho, el resto por parejas, y al pie Salir y el engranaje de Ajustes */
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.menu-grid .btn{margin:0;padding:12px 4px;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.menu-grid .btn.pending{background:linear-gradient(135deg,#fdd605,#fd9801);color:#2a1200;animation:shine 2.2s ease-in-out infinite}
/* Ventana de evento (v0.2.30): chapa arriba a la izquierda del menú; brilla si hay un premio por reclamar */
#eventChips{position:absolute;left:10px;top:10px;z-index:1;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:62%}
.ev-chip{display:flex;align-items:center;gap:7px;max-width:100%;padding:6px 12px 6px 8px;border-radius:14px;text-align:left;cursor:pointer;background:linear-gradient(145deg,#3b3545,#251c28);border:1px solid var(--gd);box-shadow:0 4px 14px rgba(0,0,0,.55),0 0 14px rgba(253,200,2,.25)}
.ev-chip .ico{flex:none;width:26px;height:26px}
.ev-chip span{min-width:0}
.ev-chip b{display:block;font:800 9px var(--ft);letter-spacing:1.5px;color:var(--gd)}
.ev-chip i{display:block;font:700 12px var(--ft);font-style:normal;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-chip.pending{animation:shine 2.2s ease-in-out infinite}
.ev-chip:active{transform:scale(.96)}
/* Notificaciones (v0.3.0): como la ventana de evento, pero arriba a la derecha */
#notifChip{position:absolute;right:10px;top:10px;z-index:1;display:grid;place-items:center;width:40px;height:40px;padding:0;border-radius:14px;cursor:pointer;color:var(--mut);background:linear-gradient(145deg,#3b3545,#251c28);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.55)}
#notifChip svg{width:22px;height:22px}
#notifChip.pending{color:var(--gd);border-color:var(--gd);box-shadow:0 4px 14px rgba(0,0,0,.55),0 0 14px rgba(253,200,2,.25);animation:shine 2.2s ease-in-out infinite}
#notifChip:active{transform:scale(.94)}
#notifChip .badge{top:-5px;right:-5px}
.fx-dot{flex:none;width:16px;height:16px;border-radius:50%;margin:0 3px}
.fx.outfit i{color:#fdc802}
.ev-row.today{background:rgba(253,200,2,.08);border-radius:8px}
.ev-row .medal{font-size:17px}
.ev-row .ev-prog{color:var(--cy);font-weight:700}
.ev-reward{flex:none;min-width:52px;text-align:center;font:800 14px var(--ft);color:var(--gd)}
.ev-reward small{display:block;margin-top:2px;font:600 9px var(--fb);color:var(--mut)}
.ev-row.missed{opacity:.55}
/* Slots guardados: ya no van en la barra superior; se ven en una chapa sobre el botón Tragamonedas */
.has-badge{position:relative}
.badge{position:absolute;top:3px;right:5px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;display:none;place-items:center;background:var(--gd);color:#2a1200;font:800 10px/17px var(--ft);font-style:normal}
.badge.on{display:grid}
/* Ciudad (v0.3.0): imagen provisional y los cuatro lugares */
.city-art{display:block;width:100%;height:auto;border-radius:12px;margin:2px 0 10px}
.city-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.city-grid .btn{margin:0;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:3px}
.city-grid .btn b{font-size:22px;line-height:1.1}
.city-grid .btn small,.hub-btn small{font:600 10px var(--ft);opacity:.75;white-space:normal}
.hub-btn{display:flex;flex-direction:column;align-items:center;gap:2px}
.inv-acts{display:flex;gap:5px;flex:none;justify-content:flex-end;align-items:center}
.inv-acts .btn{margin:0;padding:6px 8px;font-size:11px;width:auto}
.inv-sel{width:auto;margin:0;padding:5px 8px;font-size:11px}
.inv-dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px}
/* Animación de la fusión en el Altar */
#fuseFx{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(4,6,20,.86)}
#fuseFx.show{display:grid}
.fx-stage{position:relative;width:220px;height:220px}
.fx-stage img{position:absolute;top:70px;width:80px;height:80px}
#fuseFx{--fs:1}#fuseFx.fast{--fs:.45} /* "Fusionar todos" va más deprisa */
#fuseFx.show .fx-a{left:0;animation:fxA calc(var(--fs) * 1s) ease-in forwards}
#fuseFx.show .fx-b{right:0;animation:fxB calc(var(--fs) * 1s) ease-in forwards}
@keyframes fxA{0%{transform:translateX(0) rotate(0)}60%{transform:translateX(18px) rotate(-220deg)}100%{transform:translateX(70px) rotate(-360deg) scale(.5);opacity:0}}
@keyframes fxB{0%{transform:translateX(0) rotate(0)}60%{transform:translateX(-18px) rotate(220deg)}100%{transform:translateX(-70px) rotate(360deg) scale(.5);opacity:0}}
.fx-stage img.fx-res{left:50px;top:50px;width:120px;height:120px;opacity:0}
.fx-ring{position:absolute;left:10px;top:10px;width:200px;height:200px;border-radius:50%;border:3px solid #fdc802;opacity:0;box-sizing:border-box}
#fuseFx.ok .fx-res{animation:fxOk calc(var(--fs) * 1.1s) calc(var(--fs) * 1s) ease-out forwards}
#fuseFx.ok .fx-ring{animation:fxRing calc(var(--fs) * .9s) calc(var(--fs) * 1s) ease-out 2 forwards}
#fuseFx.fail .fx-res{animation:fxFail calc(var(--fs) * 1.2s) calc(var(--fs) * 1s) ease-in forwards}
#fuseFx.fail .fx-ring{border-color:#f42700;animation:fxRing calc(var(--fs) * .5s) calc(var(--fs) * 1s) ease-out forwards}
@keyframes fxOk{0%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1.35);filter:brightness(2.2) drop-shadow(0 0 26px #fdc802)}100%{opacity:1;transform:scale(1);filter:drop-shadow(0 0 14px #fdc802)}}
@keyframes fxRing{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(1.5)}}
@keyframes fxFail{0%{opacity:1;transform:translateX(0)}12%{transform:translateX(-9px)}24%{transform:translateX(9px)}36%{transform:translateX(-7px)}48%{transform:translateX(7px)}60%{opacity:1;transform:translateX(0);filter:grayscale(1) brightness(.6)}100%{opacity:0;transform:translateY(80px) rotate(28deg) scale(.5);filter:grayscale(1) brightness(.3)}}
#fuseMsg{position:absolute;left:-40px;right:-40px;top:232px;margin:0;text-align:center;font:800 15px var(--ft);opacity:0;transition:opacity .3s}
#fuseFx.done #fuseMsg,#fuseFx.fast #fuseMsg{opacity:1}
#fuseFx.sum .fx-stage img,#fuseFx.sum .fx-ring{display:none}
#fuseFx.sum #fuseMsg{top:96px}
#fuseHint{position:absolute;left:-40px;right:-40px;top:-34px;margin:0;text-align:center;font:700 12px var(--ft);color:var(--mut);display:none}
#fuseFx.fast #fuseHint{display:block}
.fuse-btns{display:flex;flex-direction:column;gap:5px;flex:1}
.fuse-btns .btn{margin:0}
.menu-foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.menu-foot .btn{width:auto;margin:0}
#mainSettingsBtn{width:46px;height:46px;padding:0;border-radius:50%;display:grid;place-items:center}
#mainSettingsBtn svg{width:24px;height:24px;color:var(--gd)}
/* Submenú de idioma, ranking y nick (v0.1.55) */
#langSeg .btn.on{background:linear-gradient(135deg,#0288f9,#0228d8);box-shadow:0 0 16px rgba(3,183,252,.4)}
.rk{display:flex;align-items:center;gap:8px;padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.06);border-radius:8px;font-size:12px;line-height:1.4}
.rk .rp{width:30px;flex:none;text-align:right;color:var(--mut);font:800 12px var(--ft)}
.rk .rn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rk .rs{flex:none;font:800 12px var(--ft);color:var(--gd)}
.rk.me{background:rgba(3,183,252,.16);outline:1px solid rgba(3,183,252,.5)}
.rk.p1 .rp{color:#fdd605}.rk.p2 .rp{color:#e7fbfc}.rk.p3 .rp{color:#fd9801}
.rk-gap{text-align:center;color:var(--mut);line-height:1}
.rk-beta{font-size:10px;color:#fd9801}
/* Perfil e imágenes de perfil (v0.2.30). La imagen es un círculo cuyo tamaño lo fija --s */
.av{--s:40px;position:relative;flex:none;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#3b3545,#161220);border:2px solid #5a5566}
.av img{width:72%;height:72%;object-fit:contain}
.av.av-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.av.av-char{border-color:#fff}
.rk .av{--s:22px;border-width:1px}
.prof-head{display:flex;align-items:center;gap:14px;text-align:left;margin-bottom:4px}
.prof-head .av{--s:72px;border-color:var(--gd);box-shadow:0 0 18px rgba(253,200,2,.35)}
.prof-pic{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.prof-pic .btn{padding:6px 9px;font-size:11px;white-space:nowrap}
.prof-head b{display:block;margin-bottom:6px;font:800 17px var(--ft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.prof-sub{margin:12px 0 6px;text-align:left;font:800 11px var(--ft);letter-spacing:1px;text-transform:uppercase;color:var(--gd)}
.cloud-btns .btn{padding:10px 4px;font-size:12px}
/* Artefactos (v0.3.0): una fila por nivel de pieza, con su botón de fusión */
.mkt-who{display:flex;align-items:center;gap:5px}
.mkt-who .av{--s:16px;border-width:1px}
#mktList .piece>span,#notifList .piece>span{flex:1;min-width:0}
#mktList .piece .btn,#notifList .piece .btn{flex:none;width:auto;min-width:74px}
.piece{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid rgba(255,255,255,.07);font-size:12px}
.piece .btn{margin:0;padding:7px 8px;font-size:10px;line-height:1.35;text-align:center}.piece small{color:var(--mut)}
.rk{cursor:pointer}
#avatarGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;justify-items:center}
#avatarGrid .av{--s:48px;cursor:pointer}
#avatarGrid .av.sel{border-color:var(--gd);box-shadow:0 0 14px rgba(253,200,2,.55)}
.av i{display:block;width:100%;height:100%;background-image:radial-gradient(circle at 35% 30%,rgba(255,255,255,.45),transparent 55%)}
#avatarGrid .av.locked>*{filter:grayscale(1) brightness(.4)}
#avatarGrid .av.locked::after{content:"🔒";position:absolute;font-size:16px}
/* Reporte de bugs (v0.1.49) */
.field{display:block;width:100%;margin-top:8px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#161220;color:var(--tx);font:500 13px var(--fb);outline:none;user-select:text;-webkit-user-select:text;touch-action:auto}
.field:focus{border-color:var(--cy);box-shadow:0 0 12px rgba(3,183,252,.25)}
textarea.field{height:130px;resize:none;line-height:1.45}
.field::placeholder{color:#7d748c}
#reportCount{text-align:right;font-size:10px;color:var(--mut);margin:3px 2px 0}
#reportStatus{min-height:16px;margin:8px 0 0;font:700 12px var(--ft)}
/* Escenas de entrada (v0.2.30): contenedor a pantalla completa y, dentro, la escena del logo */
#intro{position:absolute;inset:0;z-index:90;display:none;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 44%,#2b2435,#0d0a12 70%);transition:opacity .35s ease}
#intro.show{display:flex}#intro.out{opacity:0;pointer-events:none}
#introStage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#introSkip{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));text-align:center;font:600 11px var(--fb);color:#7d748c;letter-spacing:.3px;opacity:0;transition:opacity .3s}
#intro.skippable #introSkip{opacity:1}
.logo{position:relative;text-align:center}
.logo-ring{position:absolute;left:50%;top:50%;width:250px;height:250px;margin:-125px 0 0 -125px;border-radius:50%;border:2px solid rgba(253,200,2,.4);box-shadow:0 0 44px rgba(2,136,249,.35),inset 0 0 44px rgba(244,39,0,.22);animation:logoRing 1s ease-out both}
.logo-ring::before{content:"";position:absolute;inset:14px;border-radius:50%;border:1px dashed rgba(3,183,252,.55);animation:logoSpin 9s linear infinite}
.logo-word{position:relative;font:900 68px/1 var(--ft);letter-spacing:5px;padding-left:5px}
.logo-word span{display:inline-block;animation:logoDrop .55s cubic-bezier(.2,1.5,.4,1) both}
.logo-word span:nth-child(1){color:#f42700;text-shadow:0 0 22px rgba(244,39,0,.7);animation-delay:.25s}
.logo-word span:nth-child(2){color:#fd9801;text-shadow:0 0 22px rgba(253,152,1,.7);animation-delay:.37s}
.logo-word span:nth-child(3){color:#fdc802;text-shadow:0 0 22px rgba(253,200,2,.7);animation-delay:.49s}
.logo-word span:nth-child(4){color:#03b7fc;text-shadow:0 0 22px rgba(3,183,252,.7);animation-delay:.61s}
.logo-sub{position:relative;margin-top:8px;padding-left:10px;font:800 18px var(--ft);letter-spacing:10px;text-transform:uppercase;color:var(--tx);animation:logoSub .6s ease 1.05s both}
.logo-ball{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#7758f9;border:2px solid #fff;box-shadow:0 0 16px #7758f9;animation:logoBall .6s cubic-bezier(.3,.6,.4,1) 1.5s both}
.logo-flash{position:absolute;left:50%;top:50%;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;background:radial-gradient(circle,rgba(253,214,5,.75),rgba(253,152,1,.22) 42%,transparent 70%);opacity:0;animation:logoFlash .8s ease-out 2.05s both}
@keyframes logoRing{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
@keyframes logoSpin{to{transform:rotate(360deg)}}
@keyframes logoDrop{from{opacity:0;transform:translateY(-70px) scale(1.5)}to{opacity:1;transform:none}}
@keyframes logoSub{from{opacity:0;letter-spacing:22px}to{opacity:1;letter-spacing:10px}}
@keyframes logoBall{0%{opacity:1;transform:translateY(46vh)}85%{opacity:1}100%{opacity:0;transform:translateY(0) scale(.4)}}
@keyframes logoFlash{0%{opacity:0;transform:scale(.2)}25%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
#rotateHint{display:none;position:fixed;inset:0;z-index:99;background:#0d0a12;align-items:center;justify-content:center;text-align:center;font:700 16px var(--ft);color:var(--cy);padding:20px}
@media (orientation:landscape) and (max-height:480px) and (pointer:coarse){#rotateHint{display:flex}}
</style>

<button id="eventChip3" class="ev-chip" type="button" style="display:none"><img class="ico" data-ico="key" alt=""><span><b data-i18n="event3.chip"></b><i id="eventChipText3"></i></span></button>
