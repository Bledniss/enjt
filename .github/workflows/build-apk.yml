name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # para publicar la APK como Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Firma fija (opcional): solo si existen los secretos KEYSTORE_BASE64 y KEYSTORE_PASSWORD
      - name: Preparar clave de firma
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/firma.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/firma.jks" >> "$GITHUB_ENV"

      # La app buscará actualizaciones del juego en la carpeta web/ de este mismo repositorio
      - name: Compilar
        run: gradle assembleDebug -PupdateUrl="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/web"

      - name: Renombrar APK
        run: |
          VERSION=$(grep -o '"version"[^,}]*' web/version.json | grep -o '[0-9][0-9.]*')
          cp app/build/outputs/apk/debug/app-debug.apk "enjt-v$VERSION.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: enjt-v*.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk "enjt-v$VERSION.apk" --title "APK v$VERSION" --notes "APK instalable con el juego v$VERSION. Las versiones posteriores del juego se descargan solas al abrir la app."
